<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1c2b2d;--mut:#667476;--line:#e4e0d6;--acc:#0e7c86;--acc2:#e8f4f5;--warn:#b4570b;--ok:#2f7d4f}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:76px}
header{background:var(--acc);color:#fff;padding:18px 16px 14px}
header h1{margin:0;font-size:20px}
header p{margin:4px 0 0;font-size:14px;opacity:.9}
main{max-width:720px;margin:0 auto;padding:12px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:10px 4px 9px;font:inherit;font-size:12px;color:var(--mut);cursor:pointer}
nav button b{display:block;font-size:20px;line-height:1.1;font-weight:400}
nav button.on{color:var(--acc);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 12px}
.day-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;cursor:pointer}
.day-h h3{margin:0;font-size:16px}
.day-h small{color:var(--mut)}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--acc2);color:var(--acc);white-space:nowrap;font-weight:600}
.badge.gua{background:#fdf0dc;color:#9a5a05}.badge.vv{background:#e6f1e9;color:var(--ok)}.badge.vit{background:#ece9f7;color:#4b3f99}
.today{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc2)}
.items{margin:10px 0 0;padding:0;list-style:none}
.items li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:flex-start}
.items input[type=checkbox]{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--ok)}
.items .t{font-size:12px;color:var(--mut);min-width:46px;padding-top:3px}
.items .x{flex:1}
.items .x.done{text-decoration:line-through;color:var(--mut)}
.items a.map{font-size:13px;color:var(--acc);text-decoration:none;display:inline-block;margin-top:2px}
.add{display:flex;gap:6px;margin-top:8px}
.add input{flex:1;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14px;min-width:0}
.add button,.btn{padding:9px 12px;border:0;border-radius:8px;background:var(--acc);color:#fff;font:inherit;font-size:14px;cursor:pointer;text-decoration:none;display:inline-block}
.del{border:0;background:none;color:var(--mut);font-size:18px;cursor:pointer;padding:0 4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px}
.chips button{flex:none;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 13px;font:inherit;font-size:14px;cursor:pointer}
.chips button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.pl h3{margin:0 0 2px;font-size:16px}
.pl .ty{font-size:12px;color:var(--mut);margin-bottom:6px}
.pl p{margin:0 0 6px;font-size:15px}
.pl .tip{background:#fff7e8;border-left:3px solid #e9a63a;padding:6px 10px;font-size:14px;border-radius:0 8px 8px 0;margin:6px 0 8px}
h2{font-size:17px;margin:18px 2px 8px}
ul.tips{margin:0;padding-left:20px}ul.tips li{margin:5px 0}
textarea,.field{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:15px;background:#fff}
textarea{min-height:140px;resize:vertical}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.note{font-size:13px;color:var(--mut);margin:8px 2px}
.hide{display:none}
</style>

function viewRoteiro(){
  var td=todayStr(),h='';
  var first=DAYS[0].d,last=DAYS[DAYS.length-1].d;
  if(openDay===null){openDay=(td>=first&&td<=last)?td:first}
  h+='<div class="card"><b>Hospedagem</b>'
   +'<label>Guarapari (13 a 17/11)</label><input class="field" id="hg" placeholder="Nome, endereço e telefone" value="'+esc(S.hosp.gua||'')+'">'
   +'<label>Vila Velha — hospedagem 1</label><input class="field" id="hv" placeholder="Nome, endereço, telefone e datas" value="'+esc(S.hosp.vv||'')+'">'
   +'<label>Vila Velha — hospedagem 2</label><input class="field" id="hv2" placeholder="Nome, endereço, telefone e datas" value="'+esc(S.hosp.vv2||'')+'"></div>';
  DAYS.forEach(function(day,i){
    var isOpen=openDay===day.d;
    var ex=S.extra[day.d]||[];
    var total=ex.length,dn=0,nh=0;
    day.items.forEach(function(_,j){var k0=day.d+'-'+j;if(S.hidden['i:'+k0]){nh++;return}total++;if(S.done[k0])dn++});
    ex.forEach(function(_,j){if(S.done[day.d+'-x'+j])dn++});
    h+='<div class="card'+(day.d===td?' today':'')+'" data-d="'+day.d+'">'
     +'<div class="day-h" data-toggle="'+day.d+'"><div><h3>Dia '+(i+1)+' · '+esc(day.title)+'</h3><small>'+fmt(day.d)+(day.d===td?' · hoje':'')+' · '+dn+'/'+total+' feitos</small></div>'+badge(day.city)+'</div>';
    if(isOpen){
      h+='<ul class="items">';
      day.items.forEach(function(it,j){
        var k=day.d+'-'+j,pl=it.p?P[it.p]:null;
        if(S.hidden['i:'+k])return;
        h+='<li><input type="checkbox" data-k="'+k+'"'+(S.done[k]?' checked':'')+'><span class="t">'+esc(it.t||'')+'</span><div class="x'+(S.done[k]?' done':'')+'">'+esc(it.x)
          +(pl?'<br><a class="map" target="_blank" rel="noopener" href="'+mapUrl(pl.q)+'">📍 Abrir no mapa</a> · <a class="map" href="#" data-go="'+pl.id+'">Ver dicas</a>':'')+'</div><button class="del" data-hide="i:'+k+'" aria-label="Remover do roteiro">×</button></li>';
      });
      ex.forEach(function(t,j){
        var k=day.d+'-x'+j;
        h+='<li><input type="checkbox" data-k="'+k+'"'+(S.done[k]?' checked':'')+'><span class="t">extra</span><div class="x'+(S.done[k]?' done':'')+'">'+esc(t)+'</div><button class="del" data-del="'+day.d+'|'+j+'" aria-label="Remover">×</button></li>';
      });
      h+='</ul>'+(nh?'<p class="note"><a href="#" data-restore="'+day.d+'">Restaurar '+nh+' item(ns) removido(s) deste dia</a></p>':'')+'<div class="add"><input placeholder="Adicionar item neste dia" data-add="'+day.d+'"><button data-addbtn="'+day.d+'">+</button></div>';
    }
    h+='</div>';
  });
  h+='<p class="note">Os horários são sugestões. Toque no título do dia para abrir ou fechar. Use o × para tirar do roteiro o que você não quer fazer.</p>';
  app.innerHTML=h;
}

function viewLugares(){
  var h='<div class="chips">';
  [['all','Todos'],['gua','Guarapari'],['vv','Vila Velha'],['vit','Vitória']].forEach(function(c){
    h+='<button data-f="'+c[0]+'"'+(filter===c[0]?' class="on"':'')+'>'+c[1]+'</button>'});
  h+='</div>';
  var inF=PLACES.filter(function(p){return filter==='all'||p.city===filter});
  inF.filter(function(p){return !S.hidden['p:'+p.id]}).forEach(function(p){
    h+='<div class="card pl" id="pl-'+p.id+'"><h3>'+esc(p.name)+'</h3><div class="ty">'+esc(p.type)+' · '+CITY[p.city].n+'</div>'
     +'<p>'+esc(p.desc)+'</p><div class="tip">💡 '+esc(p.tip)+'</div>'
     +'<a class="btn" target="_blank" rel="noopener" href="'+mapUrl(p.q)+'">📍 Abrir no Google Maps</a> '
     +'<button class="btn" style="background:#8a8f90" data-hide="p:'+p.id+'">Não quero ir</button></div>';
  });
  var hid=inF.filter(function(p){return S.hidden['p:'+p.id]});
  if(hid.length){
    h+='<h2>Lugares que você removeu</h2>';
    hid.forEach(function(p){
      h+='<div class="card"><b>'+esc(p.name)+'</b> <button class="btn" style="margin-left:6px" data-unhide="p:'+p.id+'">Restaurar</button></div>';
    });
  }
  app.innerHTML=h;
}

function viewDicas(){
  var h='';
  var nh=0;
  TIPS.forEach(function(g,gi){
    var lis='';
    g[1].forEach(function(t,ti){
      var k='t:'+gi+'-'+ti;
      if(S.hidden[k]){nh++;return}
      lis+='<li>'+esc(t)+' <button class="del" data-hide="'+k+'" aria-label="Remover dica">×</button></li>';
    });
    if(lis)h+='<h2>'+esc(g[0])+'</h2><div class="card"><ul class="tips">'+lis+'</ul></div>';
  });
  if(nh)h+='<p class="note"><a href="#" data-restoretips="1">Restaurar '+nh+' dica(s) removida(s)</a></p>';
  h+='<p class="note">Horários, valores e regras de atrações mudam. Confirme no site oficial antes de ir.</p>';
  app.innerHTML=h;
}

function viewNotas(){
  app.innerHTML='<div class="card"><b>Minhas notas</b><label>Reservas, telefones, lugares que quer incluir, gastos...</label>'
   +'<textarea id="nt" placeholder="Escreva aqui">'+esc(S.notes||'')+'</textarea></div>'
   +'<p class="note">As notas e os itens marcados ficam salvos neste aparelho e navegador. Se você trocar de aparelho ou limpar os dados do navegador, eles não vêm junto.</p>';
}

function render(){
  document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.tab===tab)});
  ({roteiro:viewRoteiro,lugares:viewLugares,dicas:viewDicas,notas:viewNotas})[tab]();
}

/* ---------- EVENTOS ---------- */
document.querySelector('nav').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;tab=b.dataset.tab;render();window.scrollTo(0,0)});

app.addEventListener('click',function(e){
  var t=e.target;
  var tg=t.closest('[data-toggle]');
  if(tg&&!t.closest('a')){var d=tg.dataset.toggle;openDay=(openDay===d)?'':d;render();return}
  var go=t.closest('[data-go]');
  if(go){e.preventDefault();filter='all';tab='lugares';render();var el=document.getElementById('pl-'+go.dataset.go);if(el)el.scrollIntoView();return}
  var f=t.closest('[data-f]');if(f){filter=f.dataset.f;render();return}
  var hd=t.closest('[data-hide]');
  if(hd){S.hidden[hd.dataset.hide]=1;save();render();return}
  var uh=t.closest('[data-unhide]');
  if(uh){delete S.hidden[uh.dataset.unhide];save();render();return}
  var rs=t.closest('[data-restore]');
  if(rs){e.preventDefault();for(var q in S.hidden){if(q.indexOf('i:'+rs.dataset.restore+'-')===0)delete S.hidden[q]}save();render();return}
  var rt=t.closest('[data-restoretips]');
  if(rt){e.preventDefault();for(var q2 in S.hidden){if(q2.indexOf('t:')===0)delete S.hidden[q2]}save();render();return}
  var ab=t.closest('[data-addbtn]');
  if(ab){addItem(ab.dataset.addbtn);return}
  var del=t.closest('[data-del]');
  if(del){var p=del.dataset.del.split('|');S.extra[p[0]].splice(+p[1],1);
    // limpa marcações dos extras do dia
    for(var k in S.done){if(k.indexOf(p[0]+'-x')===0)delete S.done[k]}
    save();render();return}
});
app.addEventListener('change',function(e){
  var c=e.target;
  if(c.dataset&&c.dataset.k){if(c.checked)S.done[c.dataset.k]=1;else delete S.done[c.dataset.k];save();render()}
});
app.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.add){e.preventDefault();addItem(e.target.dataset.add)}
});
app.addEventListener('input',function(e){
  var el=e.target;
  if(el.id==='nt'){S.notes=el.value;save()}
  if(el.id==='hg'){S.hosp.gua=el.value;save()}
  if(el.id==='hv'){S.hosp.vv=el.value;save()}
  if(el.id==='hv2'){S.hosp.vv2=el.value;save()}
});
function addItem(d){
  var inp=app.querySelector('[data-add="'+d+'"]');var v=inp&&inp.value.trim();if(!v)return;
  (S.extra[d]=S.extra[d]||[]).push(v);save();render();
}

render();
</script>
</body>
</html>
